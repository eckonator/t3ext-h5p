<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:be.pageRenderer includeCssFiles="{0: '{f:uri.resource(path:\'Css/Styles.css\')}'}" />

<f:layout name="Module" />
<f:section name="Content">
    <h1>{content.title}</h1>
    <f:switch expression="{content.embedType}">
        <f:case value="div">
            <div class="h5p-content" data-content-id="{content.uid}"></div>
        </f:case>
        <f:case value="iframe">
            <div class="h5p-iframe-wrapper">
                <iframe id="h5p-iframe-{content.uid}"
                        class="h5p-iframe"
                        data-content-id="{content.uid}"
                        style="height:1px"
                        scrolling="no"
                        frameborder="0"
                        src="about:blank">
                </iframe>
            </div>
        </f:case>
    </f:switch>
</f:section>
</html>
