services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MichielRoos\H5p\:
    resource: '../Classes/*'
    exclude: '../Classes/Adapter/Core/*'

#  MichielRoos\H5p\Property\TypeConverter\UploadedFileReferenceConverter:
#    tags:
#      name: extbase.type_converter
#  MichielRoos\H5p\Property\TypeConverter\ObjectStorageConverter:
#    tags:
#      name: extbase.type_converter

  TYPO3\CMS\Backend\Template\ModuleTemplateFactory:
    public: true

  TYPO3\CMS\Core\Page\PageRenderer:
    arguments:
      $assetsCache: '@cache.assets'

  TYPO3\CMS\Core\Imaging\IconFactory:
    public: true

  H5PFrameworkInterface:
    class: 'H5PFrameworkInterface'
    public: true

  H5PFileStorage:
    class: 'H5PFileStorage'
    public: true

  TYPO3\CMS\Backend\Routing\UriBuilder:
    public: true

  MichielRoos\H5p\Controller\H5pModuleController:
    public: true

  MichielRoos\H5p\Backend\EditorController:
    public: true

  MichielRoos\H5p\Command\GenerateExportsCommand:
    tags:
      - name: console.command
        command: 'h5p:generate-exports'
        description: 'Erzeugt fehlende .h5p-Exportdateien fuer vorhandene Inhalte.'

  MichielRoos\H5p\Command\FindDuplicateContentCommand:
    tags:
      - name: console.command
        command: 'h5p:find-duplicates'
        description: 'Listet mehrfach vorhandene H5P-Inhalte samt Verwendung auf (nur lesend).'

  MichielRoos\H5p\Command\CleanupOrphanedFilesCommand:
    tags:
      - name: console.command
        command: 'h5p:cleanup-orphaned-files'
        description: 'Listet verwaiste H5P-Ordner in fileadmin/h5p auf und entfernt sie auf Wunsch.'
